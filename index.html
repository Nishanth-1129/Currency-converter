<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=1">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="container">
    <div class="header-img">
        <img src="https://cdn-icons-png.flaticon.com/512/2454/2454282.png" alt="Currency Icon">
    </div>
    <h1>Currency Converter</h1>
    
    </div>
    <h1>Currency Converter</h1>
    
    <div class="row">
        <div class="col">
            <div class="currency-box">
                <img src="https://flagsapi.com/US/flat/64.png" id="flag1" class="flag-icon">
                <select class="currency" onchange="updateFlag(0)">
                    <option value="USD">USD</option>
                </select>
            </div>
            <input type="number" id="input_currency" placeholder="0.00">
        </div>

        <div class="col">
            <div class="currency-box">
                <img src="https://flagsapi.com/IN/flat/64.png" id="flag2" class="flag-icon">
                <select class="currency" onchange="updateFlag(1)">
                    <option value="INR">INR</option>
                </select>
            </div>
            <input type="text" id="output_currency" placeholder="Result" disabled>
        </div>
    </div>

    <button onclick="convert()">Convert</button>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="script.js"></script>
</body>
</html>
